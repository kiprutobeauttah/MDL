[project]
name = "mdl"
version = "0.1.0"
description = "MDL - Mobile Diagnostic Lab by Beauttah K."
authors = [{name = "Beauttah K."}]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "adbutils>=2.4.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

