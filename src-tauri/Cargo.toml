[workspace]

[package]
name = "mdl"
version = "1.1.0"
description = "MDL - Mobile Diagnostic Lab"
authors = ["Beauttah K."]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mdl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
base64 = "0.21"
